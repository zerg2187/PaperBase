name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      GO111MODULE: on
      DATABASE_URL: postgres://test:password@localhost:5432/test?sslmode=disable
      GEMINI_API_KEY: test_key
      SEMANTIC_API_KEY: test_key
      ADMIN_SECRET_TOKEN: test_token

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify Go module
        run: |
          pwd
          ls -la
          cat go.mod
          go env GOMOD

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Create roles and extension
        run: |
          # Create roles used by RLS policies
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated;
              END IF;
            END
            \$\$;
          "
          # Create pgvector extension
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: |
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/init.sql
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/add_auth_and_guest.sql
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/remove_guest_persistence.sql
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/add_audit_logs.sql
          psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/add_guest_papers_table.sql

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run build

      - name: Run tests
        run: npm run test:run
